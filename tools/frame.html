<!doctype html>
<meta charset="utf-8">
<title>frame</title>
<!-- tools/shoot.mjs: headless Chrome will not open a window narrower than ~500 px, so phone shots run in here -->
<style>html,body{margin:0;background:#fff}iframe{border:0;display:block}</style>
<script>
  const q = new URLSearchParams(location.search);
  const f = document.createElement('iframe');
  f.width = q.get('w') || 390; f.height = q.get('h') || 844;
  f.src = q.get('src') || '/';
  document.documentElement.append(f);
</script>
